<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="55%" stop-color="#16213E"/>
      <stop offset="100%" stop-color="#0F3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E94560" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E94560" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1E2A4A" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1000" cy="250" r="300" fill="url(#glow)"/>

  <!-- 装饰：视频播放按钮图标 -->
  <g transform="translate(950, 180)">
    <circle cx="80" cy="80" r="60" fill="none" stroke="#E94560" stroke-width="3" stroke-opacity="0.4"/>
    <polygon points="65,55 65,105 110,80" fill="#E94560" fill-opacity="0.8"/>
  </g>

  <!-- 主标题 -->
  <text x="72" y="280" fill="#F8F9FA" font-size="96" font-weight="800" letter-spacing="3">B站探店店名提取</text>

  <!-- 副标题 -->
  <text x="72" y="380" fill="#F8F9FA" font-size="64" font-weight="700" letter-spacing="1">
    从视频到收藏夹，<tspan fill="#E94560">中间错了几次？</tspan>
  </text>

  <!-- 装饰线 -->
  <rect x="72" y="420" width="220" height="6" rx="3" fill="url(#accent)"/>

  <!-- 说明文字 -->
  <text x="72" y="480" fill="#A8B2C4" font-size="28" font-weight="500">
    三种提取方式 · 七项校准 · 断点续传 · 抗限流批处理
  </text>
  <text x="72" y="524" fill="#6B7B93" font-size="25" font-weight="400">
    评论区置顶图 / 视频简介 / 视频标题 — 每条链路都踩过坑
  </text>

  <!-- 底部标签 -->
  <g font-size="20" font-weight="600">
    <rect x="72" y="612" width="180" height="48" rx="24" fill="#1A1A2E" stroke="#E94560" stroke-width="1.5"/>
    <text x="162" y="642" text-anchor="middle" fill="#E94560">七项校准标准</text>

    <rect x="272" y="612" width="200" height="48" rx="24" fill="#1A1A2E" stroke="#334155" stroke-width="1.5"/>
    <text x="372" y="642" text-anchor="middle" fill="#CBD5E1">OCR形近字修正</text>

    <rect x="492" y="612" width="180" height="48" rx="24" fill="#1A1A2E" stroke="#334155" stroke-width="1.5"/>
    <text x="582" y="642" text-anchor="middle" fill="#CBD5E1">城市匹配校验</text>

    <rect x="692" y="612" width="180" height="48" rx="24" fill="#1A1A2E" stroke="#334155" stroke-width="1.5"/>
    <text x="782" y="642" text-anchor="middle" fill="#CBD5E1">断点续传</text>
  </g>
</svg>
